<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cani">
<meta name="theme-color" content="#e9e4ff">
<title>Diario Cani</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css?v=1792011062">
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div id="splash"><div class="sp-avs"></div><b>Diario Cani</b><small>Kafka &amp; Zoe</small></div>

<!-- Login -->
<section id="login" class="screen" hidden>
  <div class="glass card login">
    <h1>Diario Cani</h1>
    <p class="muted">Accedi o crea un account.</p>
    <input id="lEmail" type="email" placeholder="Email" autocomplete="email">
    <input id="lPass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn primary" id="lGo">Accedi</button>
    <button class="btn" id="lNew">Crea account</button>
    <p id="lMsg" class="muted"></p>
  </div>
</section>

<!-- App -->
<main id="app" hidden>
  <header class="top">
    <div class="seg" id="dogSeg"></div>
    <div class="top-r"><span id="sync" class="sync" title="Sincronizzazione"></span><button id="gear" class="gear" aria-label="Impostazioni">⚙️</button></div>
  </header>
  <h1 class="large" id="title"></h1>
  <p id="subtitle" class="subtitle"></p>
  <div id="view"></div>
</main>

<nav class="tabbar glass" id="tabbar" hidden>
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Riepilogo</button>
  <button data-tab="diario"><svg viewBox="0 0 24 24"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v15H5.5A1.5 1.5 0 0 0 4 19.5zM4 19.5A1.5 1.5 0 0 0 5.5 21H19v-3"/><path d="M8 7h7M8 11h5"/></svg>Diario</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Statistiche</button>
  <button data-tab="vet"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9.2-9A5.2 5.2 0 0 1 12 6.3 5.2 5.2 0 0 1 21.2 12C19 16.6 12 21 12 21z"/><path d="M8 12h2.5l1.5-3 2 6 1.5-3H17"/></svg>Veterinario</button>
</nav>
<button class="fab" id="fab" hidden aria-label="Aggiungi">+</button>

<!-- Scelta tipo -->
<dialog id="pick" class="sheet">
  <div class="glass card">
    <h2 id="pickTitle">Cosa vuoi segnare?</h2>
    <div id="pickList" class="picklist"></div>
    <button class="btn" data-close>Annulla</button>
  </div>
</dialog>

<!-- Modulo -->
<dialog id="form" class="sheet">
  <form class="glass card" id="frm" method="dialog">
    <h2 id="fTitle"></h2>
    <div id="fBody"></div>
    <div class="row">
      <button type="button" class="btn danger" id="fDel" hidden>Elimina</button>
      <button type="button" class="btn" data-close>Annulla</button>
      <button type="submit" class="btn primary">Salva</button>
    </div>
  </form>
</dialog>

<input type="file" id="importFile" accept=".json,application/json" hidden>
<!-- Dettatura -->
<dialog id="voice" class="sheet">
  <div class="glass card">
    <h2 id="vTitle">Detta</h2>
    <div class="vrec"><button type="button" id="vMic" class="mic" aria-label="Microfono">🎙️</button><p id="vHint" class="small muted"></p></div>
    <textarea id="vText" placeholder="Es. &quot;Oggi visita dal veterinario, pesa 18 chili, il fenobarbital nel sangue è 28, aumentare Phenoleptil a tre quarti due volte al giorno, ricontrollo tra tre mesi&quot;"></textarea>
    <button type="button" class="btn primary" id="vGo">Analizza</button>
    <div id="vList"></div>
    <div class="row"><button type="button" class="btn" data-close>Annulla</button><button type="button" class="btn primary" id="vSave" hidden>Salva</button></div>
  </div>
</dialog>

<!-- Cambia una dose per un solo giorno -->
<dialog id="doseEdit" class="sheet">
  <div class="glass card">
    <h2 id="deTitle">Cambia dose</h2>
    <p id="deOrig" class="small muted"></p>
    <label>Orario</label><input id="deTime" type="time">
    <label>Farmaco e dose</label><input id="deWhat" type="text">
    <div class="row" style="margin-top:16px"><button type="button" class="btn" data-close>Annulla</button><button type="button" class="btn primary" id="deSave">Salva</button></div>
    <button type="button" class="btn" id="deReset" hidden>Ripristina come previsto</button>
  </div>
</dialog>

<!-- Impostazioni -->
<dialog id="settings" class="sheet">
  <div class="glass card">
    <h2>⚙️ Impostazioni</h2>
    <div id="setBody"></div>
    <button class="btn" data-close>Chiudi</button>
  </div>
</dialog>

<div id="toast" class="toast" hidden></div>

<!-- Report stampabile -->
<div id="print"></div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="app.js?v=1792011062"></script>
<script src="voice.js?v=1792011062"></script>
</body>
</html>
